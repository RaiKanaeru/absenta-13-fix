name: Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: absenta_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" -P3306 -uroot -proot --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
      
      - name: Setup test database
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -proot -e "CREATE DATABASE IF NOT EXISTS absenta_test;"
          mysql -h 127.0.0.1 -P 3306 -u root -proot absenta_test < absenta13.sql
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: absenta_test
      
      - name: Run unit tests
        run: npm run test:unit
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Run security tests
        run: npm run test:security
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage/
            test-results.json
            playwright-report/
      
      - name: Comment PR with test results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Read coverage summary
            let coverageSummary = 'No coverage data available';
            try {
              const coveragePath = path.join('coverage', 'coverage-summary.json');
              if (fs.existsSync(coveragePath)) {
                const coverage = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
                coverageSummary = `
                ## 📊 Test Coverage Summary
                
                | Metric | Percentage |
                |--------|------------|
                | Lines | ${coverage.total.lines.pct}% |
                | Functions | ${coverage.total.functions.pct}% |
                | Branches | ${coverage.total.branches.pct}% |
                | Statements | ${coverage.total.statements.pct}% |
                `;
              }
            } catch (error) {
              console.log('Could not read coverage summary:', error.message);
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Test Results
              
              ${coverageSummary}
              
              ✅ All tests passed successfully!
              
              📋 **Test Summary:**
              - Unit Tests: ✅ Passed
              - Integration Tests: ✅ Passed  
              - Security Tests: ✅ Passed
              - Coverage: ✅ Generated
              `
            });

  e2e:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Start server
        run: |
          npm run start:modern &
          sleep 10
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: 
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: 
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  performance:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Artillery
        run: npm install -g artillery
      
      - name: Start server
        run: |
          npm run start:modern &
          sleep 10
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: 
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Run performance tests
        run: npm run test:performance
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: 
          DB_NAME: absenta_test
          JWT_SECRET: test-jwt-secret-key-for-testing-only
          PASSWORD_PEPPER: test-pepper-2025
          PORT: 3001
          LOG_LEVEL: error
      
      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-results
          path: artillery-report/
          retention-days: 30
